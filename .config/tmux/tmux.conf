#### Config improvements
# Dynamic path resolution for plugins and scripts
set -g @config_dir "$(dirname "$TMUX_CONFIG")"
set-environment -g TMUX_PLUGIN_MANAGER_PATH "#{@config_dir}/plugins/"

# Integración del mouse con tmux
set -g mouse on

# Ventanas y paneles inician en 1
set -g base-index 1; set-window-option -g pane-base-index 1

# Selección de paneles con alt + flecha
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Copiar selección al clipboard
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel \; run "tmux save-buffer - | xclip -i -selection clipboard"
set-option -g status-interval 1
#### --- PLUGINS --- ####
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'dracula/tmux' 

### --- Ajustes Dracula --- ###
set -g @dracula-show-powerline true
set -g @dracula-show-left-icon session
set -g @dracula-show-empty-plugins false
set -g @dracula-refresh-rate 1

# Colores personalizados para el timer
set -g @dracula-timer-colors "dark_purple white" # Fondo púrpura oscuro, texto blanco por defecto

# Colores específicos para las fases (usarán los nombres de la paleta de Dracula)
set -g @dracula-timer-foothold-color "cyan"     # Texto de Foothold
set -g @dracula-timer-escalation-color "yellow" # Texto de Escalation
set -g @dracula-timer-headshot-color "purple"    # Texto de Headshot
set -g @dracula-timer-limit-color "red"         # Texto cuando excede el límite
set -g @dracula-timer-paused-color "white"     # Texto cuando está pausado
# Colores específicos para las fases (usarán los nombres de la paleta de Dracula)
set -g @dracula-plugins "ctf-timer vpn-status"

#### - KEY BINDINGS - ####

# Puedes usar Alt+tecla (M-) si prefieres, quitando el 'bind-key' y añadiendo '-n M-':
bind -n M-t run-shell "#{@config_dir}/plugins/tmux/scripts/ctf_timer.sh start"
bind -n M-p run-shell "#{@config_dir}/plugins/tmux/scripts/ctf_timer.sh pause"
bind -n M-n run-shell "#{@config_dir}/plugins/tmux/scripts/ctf_timer.sh next"
bind -n M-s run-shell "#{@config_dir}/plugins/tmux/scripts/ctf_timer.sh status"


### -- One-Liners
# One-liner banderas reglamentarias (/etc/passwd env /etc/shadow /root) (ctrl + b) e
bind-key e send-keys "echo;P='ETSCTF_[0-9a-fA-F]{32}';for F in env /etc/passwd /proc/1/environ /etc/shadow /root/;do V=\$( (case \$F in env)env;;/proc/1/environ)tr '\\0' '\\n'<\$F;;/root/)ls \$F;;*)cat \$F;;esac)2>/dev/null|grep -oE \$P);[ -n \"\$V\" ]&&printf \"%-20s %s\\n\" \$F: \"\$V\";[ \$F = /etc/passwd ]&&echo ---;done;echo" C-m

# One-liner banderas 'Other' dentro de archivos (ctrl +b) shift + e 
bind-key E send-keys "echo;P='ETSCTF_[0-9a-fA-F]{32}';find / -xdev \\( -path /proc -o -path /sys -o -path /dev -o -path /run -o -path /etc \\) -prune -o -type f -print0 2>/dev/null|xargs -0 grep -HaoE \"\$P\" 2>/dev/null|awk -F':' '{printf \"%-30s %s\\n\", \$1, \$2}';echo" C-m

# One-liner banderas 'Other' como nombre de archivo (ctrl +b) alt + e
bind-key M-e send-keys "echo;find / -xdev \\( -path /proc -o -path /sys -o -path /dev -o -path /run -o -path /etc \\) -prune -o -name \"*ETSCTF_*\" -print 2>/dev/null;echo" C-m

# Giga-godzilla one-liner (ctrl + b) shift + alt + e
bind-key M-E send-keys "echo;P='ETSCTF_[0-9a-fA-F]{32}';(for F in env /etc/passwd /proc/1/environ /etc/shadow /root/;do V=\$( (case \$F in env)env;;/proc/1/environ)tr '\\0' '\\n'<\$F;;/root/)ls \$F;;*)cat \$F;;esac)2>/dev/null|grep -oE \"\$P\" );[ -n \"\$V\" ]&&printf \"%-17s %s\\n\" \"\$F:\" \"\$V\";done);echo ---;(find / -xdev \\( -path /proc -o -path /sys -o -path /dev -o -path /run -o -path /etc \\) -prune -o -type f -print0 2>/dev/null|xargs -0 grep -HaoE \"\$P\" 2>/dev/null|awk -F':' '{printf \"%-30s %s\\n\",\$1,\$2}');echo ---;(find / -xdev \\( -path /proc -o -path /sys -o -path /dev -o -path /run -o -path /etc \\) -prune -o -name \"*ETSCTF_*\" -print 2>/dev/null);echo" C-m

#### --- RUNS --- ####
run '#{@config_dir}/plugins/tpm/tpm'
