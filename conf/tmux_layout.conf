# Layout de la sesión tmux que se crea por cada target.
#
# Formato: una entrada por pane, en orden de creación.
#   "<ventana>|<orden>|<comando>|<submit>|<guard>"
#
#   ventana  Nombre de la ventana. La primera ventana citada crea la sesión;
#            las siguientes se crean como ventanas nuevas.
#   orden    Posición del pane dentro de la ventana (1..N). El pane 1 es el
#            que tmux crea con la ventana; los siguientes se generan con split.
#   comando  Texto enviado con send-keys. Vacío = el pane solo queda en el
#            prompt. Admite placeholders (ver abajo).
#   submit   1 = se añade C-m y el comando se ejecuta.
#            0 = el comando queda escrito, esperando que el usuario lo lance.
#   guard    "archivo::texto" = solo se envía el comando si 'texto' (con
#            placeholders expandidos) NO aparece ya en 'archivo'. Vacío = sin
#            guarda.
#
# Placeholders disponibles:
#   %IP% %SESSION% %SUBDOMAIN% %WORKSPACE% %REPO%

TMUX_LAYOUT=(
"Recon|1|sudo sh -c \"echo '%IP%        %SESSION%.%SUBDOMAIN%' >> /etc/hosts\"|0|/etc/hosts::%IP%        %SESSION%.%SUBDOMAIN%"
"Recon|2|target scan ports|0|"
"Exploit|1|penelope -p 9000|0|"
"Misc.|1|%REPO%/.config/tmux/plugins/tmux/scripts/ctf_timer.sh start|1|"
)